<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Mesas</title></head><body><main><h1>Mesas</h1><a th:href="@{/admin/mesas/agregar}">Agregar mesa</a><table><tr><th>Número</th><th>Estado</th><th>Acciones</th></tr><tr th:each="mesa : ${mesas}"><td th:text="${mesa.numero}"></td><td th:text="${mesa.estado}"></td><td><a th:href="@{/admin/mesas/editar/{id}(id=${mesa.id})}">Editar</a></td></tr></table></main></body></html>

<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Personas</title></head><body><main><h1>Personas</h1><a th:href="@{/admin/personas/agregar}">Agregar persona</a><table><thead><tr><th>Documento</th><th>Nombre</th><th>Correo</th><th>Acciones</th></tr></thead><tbody><tr th:each="persona : ${personas}"><td th:text="${persona.documento}"></td><td th:text="${persona.nombre}"></td><td th:text="${persona.email}"></td><td><a th:href="@{/admin/personas/editar/{id}(id=${persona.id})}">Editar</a></td></tr></tbody></table></main></body></html>

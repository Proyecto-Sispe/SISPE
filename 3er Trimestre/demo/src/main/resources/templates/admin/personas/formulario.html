<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Persona</title></head><body><main><h1 th:text="${persona.id == null ? 'Agregar persona' : 'Editar persona'}"></h1><form th:action="@{/admin/personas/guardar}" th:object="${persona}" method="post"><input type="hidden" th:field="*{id}"><label>Documento<input th:field="*{documento}" required></label><label>Nombre<input th:field="*{nombre}" required></label><label>Correo<input type="email" th:field="*{email}" required></label><button type="submit">Guardar</button></form></main></body></html>

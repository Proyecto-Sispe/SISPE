<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Registro | SISPE</title><link rel="stylesheet" href="/css/sispe.css"></head>
<body class="auth-page"><main class="auth-card"><span class="eyebrow">SISPE</span><h1>Crear cuenta</h1><p class="muted">Registra un usuario para acceder al sistema.</p><p class="error" th:if="${error}" th:text="${error}"></p><form method="post" action="/registro"><label>Documento<input name="idUsuario" type="number" required></label><label>Nombre<input name="nombre" required></label><label>Apellido<input name="apellido" required></label><label>Teléfono<input name="telefono" type="number" required></label><label>Correo<input name="email" type="email" required></label><label>Contraseña<input name="password" type="password" minlength="6" required></label><button class="primary" type="submit">Registrarme</button></form><p><a href="/login">Volver al inicio de sesión</a></p></main></body></html>

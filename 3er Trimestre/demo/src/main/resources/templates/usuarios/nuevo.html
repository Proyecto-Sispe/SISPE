<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registrar persona | SISPE</title><link rel="stylesheet" href="/css/sispe.css"></head><body><div class="layout"><aside class="sidebar"><div class="brand">SISPE</div><nav class="nav"><a href="/dashboard">Panel</a><a class="active" href="/usuarios">Usuarios</a><a href="/mesas">Mesas</a><a href="/pedidos">Pedidos</a></nav></aside><main class="main"><header class="top"><div><p class="eyebrow">SISPE / ADMINISTRACIÓN</p><h1 class="title">Registrar nueva persona</h1><p class="sub">Formulario equivalente a personas_agregar.php.</p></div><a class="btn" href="/usuarios">Volver</a></header><section class="form-card"><form method="post" action="/usuarios/guardar" class="form-grid" th:object="${usuario}"><label>Tipo documento<select name="tipoDocumento" required><option value="1">Cédula de ciudadanía</option><option value="2">Tarjeta de identidad</option><option value="3">Cédula de extranjería</option></select></label><label>Identificación<input name="id" required></label><label>Primer nombre<input name="primerNombre" required></label><label>Segundo nombre<input name="segundoNombre"></label><label>Primer apellido<input name="primerApellido" required></label><label>Segundo apellido<input name="segundoApellido"></label><label>Email<input type="email" name="email" required></label><label>Teléfono<input name="telefono" required></label><label>Contraseña<input type="password" name="password" required minlength="6"></label><div class="form-actions"><a class="btn secondary" href="/usuarios">Cancelar</a><button class="btn" type="submit">Guardar persona</button></div></form></section></main></div></body></html>

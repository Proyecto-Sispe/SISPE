<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usuarios | SISPE</title><link rel="stylesheet" href="/css/sispe.css"></head><body><div class="layout"><aside class="sidebar"><div class="brand">SISPE</div><nav class="nav"><a href="/dashboard">Panel</a><a class="active" href="/usuarios">Usuarios</a><a href="/mesas">Mesas</a><a href="/reportes">Reportes</a></nav></aside><main class="main"><header class="top"><div><p class="eyebrow">SISPE / ADMINISTRACIÓN</p><h1 class="title">Usuarios registrados</h1><p class="sub">Personas almacenadas en el sistema.</p></div><a class="btn" href="/usuarios/nuevo">Nuevo usuario</a></header><section class="table-wrap"><table class="table"><thead><tr><th>Documento</th><th>Nombre</th><th>Email</th><th>Estado</th><th>Acciones</th></tr></thead><tbody><tr th:each="usuario : ${usuarios}"><td th:text="${usuario.id}">1</td><td th:text="${usuario.nombreCompleto}">Nombre</td><td th:text="${usuario.email}">correo</td><td><span class="badge" th:text="${usuario.activo ? 'Activo' : 'Inactivo'}">Activo</span></td><td><a class="btn danger" th:href="@{'/usuarios/eliminar/' + ${usuario.id}}">Eliminar</a></td></tr><tr th:if="${#lists.isEmpty(usuarios)}"><td colspan="5">No hay usuarios registrados.</td></tr></tbody></table></section></main></div></body></html>

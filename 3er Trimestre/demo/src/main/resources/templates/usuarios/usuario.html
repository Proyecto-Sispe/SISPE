<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Usuario</title>
</head>
<body>
    <h2>Registro de Usuario</h2>

    <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
        
        <div>
            <label>Nombre:</label>
            <input type="text" th:field="*{nombre}" />
            <span th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" style="color:red;"></span>
        </div>

        <div>
            <label>Email:</label>
            <input type="email" th:field="*{email}" />
            <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:red;"></span>
        </div>

        <div>
            <label>Edad:</label>
            <input type="number" th:field="*{edad}" />
            <span th:if="${#fields.hasErrors('edad')}" th:errors="*{edad}" style="color:red;"></span>
        </div>

        <button type="submit">Guardar</button>
    </form>
</body>
</html>

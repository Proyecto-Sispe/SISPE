<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Panel de cocina</title></head><body><main><h1>Panel de pedidos</h1><section><article th:each="pedido : ${pedidos}"><h2 th:text="|Pedido #${pedido.id}|"></h2><p th:text="${pedido.estado}"></p><form th:action="@{/cocina/pedidos/estado}" method="post"><input type="hidden" name="pedidoId" th:value="${pedido.id}"><select name="estado"><option value="EN_PREPARACION">En preparación</option><option value="LISTO">Listo</option><option value="ENTREGADO">Entregado</option></select><button type="submit">Actualizar</button></form></article></section></main></body></html>

<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedidos | SISPE</title><link rel="stylesheet" href="/css/sispe.css"></head>
<body><div class="layout"><aside class="sidebar"><div class="brand">SISPE</div><nav class="nav"><a href="/menu">Menú digital</a><a href="/mesas">Mesas</a><a class="active" href="/pedidos">Pedidos</a><a href="/facturas">Facturación</a><a href="/reportes">Reportes</a></nav></aside><main class="main"><header class="top"><div><p class="eyebrow">SISPE / OPERACIÓN</p><h1 class="title">Pedidos registrados</h1><p class="sub">Consulta todos los pedidos almacenados en MySQL y su estado actual.</p></div><div class="actions"><a class="btn" href="/pedidos/nuevo">+ Agregar pedido</a><a class="btn secondary" href="/dashboard">Volver al panel</a></div></header><section class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Mesa</th><th>Cliente</th><th>Estado</th><th>Prioridad</th><th>Fecha</th></tr></thead><tbody><tr th:each="pedido : ${pedidos}"><td th:text="${pedido.id}">1</td><td th:text="${pedido.mesaId}">1</td><td th:text="${pedido.clienteId != null ? pedido.clienteId : 'Sin registrar'}">Sin registrar</td><td><span class="badge" th:text="${pedido.estado}">pendiente</span></td><td th:text="${pedido.prioridad ?: 'normal'}">normal</td><td th:text="${pedido.fechaPedido}">2026-01-01</td></tr><tr th:if="${#lists.isEmpty(pedidos)}"><td colspan="6">No hay pedidos registrados.</td></tr></tbody></table></section></main></div></body></html>

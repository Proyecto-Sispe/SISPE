<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reportes | SISPE</title><link rel="stylesheet" th:href="@{/css/sispe.css}"></head><body><main class="shell"><header><div><p class="eyebrow">SISPE / ANALÍTICA</p><h1>Reportes operativos</h1><p class="muted">Resumen de pedidos y ventas registrados en el sistema.</p></div><a class="logout" href="/dashboard">Volver al panel</a></header><section class="report-cards"><article><span>Pedidos registrados</span><strong th:text="${totalPedidos}">0</strong></article><article><span>Ventas acumuladas</span><strong th:text="${#numbers.formatDecimal(totalVentas, 1, 2)}">0.00</strong></article><article><span>Facturas emitidas</span><strong th:text="${#lists.size(facturas)}">0</strong></article></section><form class="filters" method="get"><input name="estado" placeholder="Estado del pedido" th:value="${param.estado}"><input name="usuario" placeholder="ID de usuario" th:value="${param.usuario}"><button type="submit">Filtrar</button><a href="/reportes">Limpiar</a></form><section class="table-wrap"><h2>Pedidos recientes</h2><table><thead><tr><th>ID</th><th>Mesa</th><th>Estado</th><th>Prioridad</th><th>Fecha</th></tr></thead><tbody><tr th:each="pedido : ${pedidos}"><td th:text="${pedido.id}">1</td><td th:text="${pedido.mesaId}">1</td><td><span class="badge" th:text="${pedido.estado}">pendiente</span></td><td th:text="${pedido.prioridad}">normal</td><td th:text="${pedido.fechaPedido}">2026-01-01</td></tr><tr th:if="${#lists.isEmpty(pedidos)}"><td colspan="5">No hay pedidos registrados.</td></tr></tbody></table></section></main></body></html>

<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Mesas | SISPE</title>
    <link rel="stylesheet" href="/css/sispe.css">
</head>

<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="brand">SISPE</div>
            <nav class="nav"><a href="/menu">Menú digital</a><a class="active" href="/mesas">Mesas</a><a
                    href="/pedidos">Pedidos</a><a href="/facturas">Facturación</a><a href="/reportes">Reportes</a></nav>
        </aside>
        <main class="main">
            <header class="top">
                <div>
                    <h1 class="title">Mesas</h1>
                    <p class="sub">Consulta disponibilidad y administra la distribución del restaurante.</p>
                </div><a class="btn" href="#nueva">Agregar mesa</a>
            </header>
            <section class="grid">
                <article class="card" th:each="mesa : ${mesas}">
                    <h3 th:text="'Mesa ' + mesa.id">Mesa 1</h3>
                    <p class="sub" th:text="${mesa.ubicacion}">Primer piso</p>
                    <p th:text="'Capacidad: ' + ${mesa.capacidad}">Capacidad</p><strong
                        th:text="${mesa.ocupada ? 'Ocupada' : 'Disponible'}">Disponible</strong>
                    <div th:if="${!mesa.ocupada}" style="margin-top:14px"><img th:src="@{'/mesas/' + ${mesa.id} + '/qr'}" th:alt="'QR Mesa ' + ${mesa.id}" width="160" height="160"><p class="sub">Escanea para pedir</p></div>
                    <form th:if="${mesa.ocupada}" th:action="@{'/mesas/' + ${mesa.id} + '/habilitar'}" method="post" style="margin-top:14px"><button class="btn" type="submit">Habilitar mesa</button></form>
                    <form th:action="@{'/mesas/eliminar/' + mesa.id}" method="post" style="margin-top:14px"><button
                            class="btn danger" type="submit">Eliminar</button></form>
                </article>
            </section>
            <section id="nueva" class="card" style="margin-top:18px">
                <h2>Agregar mesa</h2>
                <form class="form" action="/mesas/guardar" method="post"><input name="id" type="number"
                        placeholder="Número de mesa" required><input name="capacidad" type="number"
                        placeholder="Capacidad" required><input name="ubicacion" placeholder="Ubicación" required><input
                        name="ocupada" type="hidden" value="false"><button class="btn" type="submit">Guardar
                        mesa</button></form>
            </section>
        </main>
    </div>
</body>

</html>

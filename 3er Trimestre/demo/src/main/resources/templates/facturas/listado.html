<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Facturas</title></head><body><main><h1>Facturas</h1><table><tr><th>Número</th><th>Fecha</th><th>Total</th><th>Detalle</th></tr><tr th:each="factura : ${facturas}"><td th:text="${factura.numero}"></td><td th:text="${factura.fecha}"></td><td th:text="${factura.total}"></td><td><a th:href="@{/facturas/{id}(id=${factura.id})}">Ver</a></td></tr></table></main></body></html>

<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Factura</title></head><body><main><h1 th:text="|Factura ${factura.numero}|"></h1><p th:text="${factura.fecha}"></p><table><tr><th>Concepto</th><th>Cantidad</th><th>Importe</th></tr><tr th:each="detalle : ${factura.detalles}"><td th:text="${detalle.descripcion}"></td><td th:text="${detalle.cantidad}"></td><td th:text="${detalle.importe}"></td></tr></table><h2 th:text="|Total: ${factura.total}|"></h2><a th:href="@{/facturas/{id}/pdf(id=${factura.id})}">Descargar PDF</a></main></body></html>

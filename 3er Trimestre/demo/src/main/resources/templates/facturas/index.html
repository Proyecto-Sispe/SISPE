<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Facturas | SISPE</title>
    <link rel="stylesheet" href="/css/sispe.css">
</head>

<body>
    <main class="shell">
        <header>
            <div><span class="eyebrow">ADMINISTRACIÓN</span>
                <h1>Facturación</h1>
                <p>Historial de facturas generadas.</p>
            </div><a class="logout" href="/dashboard">Volver al panel</a>
        </header>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Factura</th>
                        <th>Pedido</th>
                        <th>Fecha</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="factura : ${facturas}">
                        <td th:text="${factura.id}">1</td>
                        <td th:text="${factura.pedidoId}">1</td>
                        <td th:text="${factura.fechaHora}">2026-01-01</td>
                        <td th:text="${factura.total}">$0</td>
                    </tr>
                </tbody>
            </table>
            <p th:if="${#lists.isEmpty(facturas)}">No hay facturas registradas.</p>
        </div>
    </main>
</body>

</html>

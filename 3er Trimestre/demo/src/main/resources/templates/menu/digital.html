<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menú digital | SISPE</title><link rel="stylesheet" href="/css/sispe.css"></head>
<body class="digital-page"><nav class="digital-nav"><a class="brand" href="/menu/digital">SISPE</a><div><a href="/menu/digital">Menú</a><a href="/cliente/pedido">Mi pedido</a><a href="/login">Iniciar sesión</a></div></nav>
<header class="digital-hero"><p class="eyebrow">SISPE / MENÚ DIGITAL</p><h1>Menú de comida rápida</h1><p>Elige tus productos y agrégalos a tu pedido.</p></header>
<main class="digital-content"><div class="digital-stats"><span><strong th:text="${#lists.size(productos)}">0</strong> productos</span></div><section class="categoria" th:each="producto : ${productos}"><div class="item"><div><h2 th:text="${producto.producto}">Producto</h2><p class="desc" th:text="${producto.descripcion}">Descripción</p><p class="precio" th:text="${#numbers.formatDecimal(producto.precio, 0, 'POINT', 0, 'COMMA') + ' $'}">$0</p></div><form method="post" action="/cliente/carrito/agregar"><input type="hidden" name="productoId" th:value="${producto.id}"><button class="btn-agregar" type="submit">Agregar al pedido</button></form></div></section><p class="empty" th:if="${#lists.isEmpty(productos)}">No hay productos disponibles.</p></main></body></html>

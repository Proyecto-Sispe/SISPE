<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menú | SISPE</title><link rel="stylesheet" href="/css/sispe.css"></head><body><div class="layout"><aside class="sidebar"><div class="brand">SISPE</div><nav class="nav"><a class="active" href="/menu">Menú digital</a><a href="/mesas">Mesas</a><a href="/pedidos">Pedidos</a><a href="/facturas">Facturación</a><a href="/reportes">Reportes</a></nav></aside><main class="main"><header class="top"><div><h1 class="title">Gestión del menú</h1><p class="sub">Administra los productos disponibles para tus clientes.</p></div><a class="btn" href="#nuevo">Nuevo producto</a></header><section class="table-wrap"><table class="table"><thead><tr><th>Producto</th><th>Descripción</th><th>Precio</th><th>Categoría</th><th>Acciones</th></tr></thead><tbody><tr th:each="producto : ${productos}"><td th:text="${producto.producto}">Producto</td><td th:text="${producto.descripcion}">Descripción</td><td th:text="${producto.precio}">$0</td><td th:text="${producto.categoria != null ? producto.categoria.nombre : 'Sin categoría'}">Categoría</td><td><form th:action="@{'/menu/eliminar/' + producto.id}" method="post"><button class="btn danger" type="submit">Eliminar</button></form></td></tr><tr th:if="${#lists.isEmpty(productos)}"><td colspan="5">No hay productos registrados.</td></tr></tbody></table></section><section id="nuevo" class="card" style="margin-top:18px"><h2>Agregar producto</h2><form class="form" action="/menu/guardar" method="post"><input name="id" type="number" placeholder="ID del producto" required><input name="producto" placeholder="Nombre del producto" required><input name="precio" type="number" step="0.01" placeholder="Precio" required><textarea name="descripcion" placeholder="Descripción" required></textarea><input name="categoria.id" type="number" placeholder="ID de categoría" required><button class="btn" type="submit">Guardar producto</button></form></section></main></div></body></html>

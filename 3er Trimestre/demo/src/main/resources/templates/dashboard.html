<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Panel | SISPE</title>
    <link rel="stylesheet" href="/css/sispe.css">
</head>

<body>
    <main class="shell">
        <header>
            <div>
                <p class="eyebrow">SISPE / PANEL</p>
                <h1 th:text="'Panel de ' + ${session.rol}">Centro de operaciones</h1>
                <p>Acceso controlado según tu rol: <strong th:text="${session.rol}">usuario</strong>.</p>
            </div><a class="logout" href="/logout">Cerrar sesión</a>
        </header>
        <section class="cards">
            <a th:if="${session.rol == 'Administrador' || session.rol == 'Mesero'}" href="/menu">Menú <span>Administrar productos</span></a>
            <a th:if="${session.rol == 'Administrador' || session.rol == 'Mesero'}" href="/mesas">Mesas <span>Ver disponibilidad y QR</span></a>
            <a th:if="${session.rol == 'Administrador'}" href="/usuarios">Usuarios <span>Gestionar personas</span></a>
            <a th:if="${session.rol == 'Administrador' || session.rol == 'Cocinero'}" href="/cocina">Cocina <span>Controlar pedidos activos</span></a>
            <a th:if="${session.rol == 'Administrador'}" href="/facturas">Facturas <span>Consultar ventas</span></a>
            <a th:if="${session.rol == 'Cliente'}" href="/menu">Menú digital <span>Realizar pedido</span></a>
        </section>
    </main>
</body>

</html>

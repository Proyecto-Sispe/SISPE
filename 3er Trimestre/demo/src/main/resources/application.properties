spring.application.name=sispe
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sistema?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.thymeleaf.cache=false
spring.mvc.hiddenmethod.filter.enabled=true
server.error.whitelabel.enabled=false

# Para producción, configurar DB_URL, DB_USERNAME y DB_PASSWORD como variables de entorno.

spring.web.resources.static-locations=classpath:/static/
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - SISPE</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background: #f8fafc; color: #334155; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 2rem 0; }
        .card { background: white; padding: 2.5rem; border-radius: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h1 { margin-bottom: 1.5rem; color: #0f172a; text-align: center; font-size: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; font-weight: 600; color: #475569; }
        input, select { width: 100%; padding: 0.6rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; }
        button { width: 100%; padding: 0.75rem; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 1rem; }
        button:hover { background: #1d4ed8; }
        .error { color: #ef4444; font-size: 0.85rem; margin-bottom: 1rem; text-align: center; }
        .footer-link { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; }
        .footer-link a { color: #2563eb; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Crear cuenta</h1>

        <p class="error" th:if="${error}" th:text="${error}"></p>

        <form th:action="@{/registro}" method="post" th:object="${persona}">
            
            <div class="form-group">
                <label>Tipo de Documento:</label>
                <select th:field="*{tipoDocumento}" required>
                    <option value="" disabled selected>Seleccione una opción</option>
                    <option value="1">Cédula de ciudadanía</option>
                    <option value="2">Tarjeta de identidad</option>
                    <option value="3">Cédula de extranjería</option>
                </select>
            </div>

            <div class="form-group">
                <label>Número de Documento:</label>
                <input type="number" th:field="*{idUsuario}" required>
            </div>

            <div class="form-group">
                <label>Primer Nombre:</label>
                <input type="text" th:field="*{primerNombre}" required>
            </div>

            <div class="form-group">
                <label>Segundo Nombre:</label>
                <input type="text" th:field="*{segundoNombre}">
            </div>

            <div class="form-group">
                <label>Primer Apellido:</label>
                <input type="text" th:field="*{primerApellido}" required>
            </div>

            <div class="form-group">
                <label>Segundo Apellido:</label>
                <input type="text" th:field="*{segundoApellido}">
            </div>

            <div class="form-group">
                <label>Teléfono:</label>
                <input type="number" th:field="*{telefono}" required>
            </div>

            <div class="form-group">
                <label>Correo:</label>
                <input type="email" th:field="*{correo}" required>
            </div>

            <div class="form-group">
                <label>Contraseña:</label>
                <input type="password" th:field="*{password}" required>
            </div>

            <button type="submit">Registrarse</button>
        </form>

        <div class="footer-link">
            <a th:href="@{/login}">Volver al Login</a>
        </div>
    </div>

</body>
</html>

<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Registrar pedido | SISPE</title>
    <link rel="stylesheet" th:href="@{/css/sispe.css}">
</head>

<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="brand">SISPE</div>
            <nav class="nav">
                <a th:href="@{/inicio}">← Volver al panel</a>
                <a th:href="@{/menu}">Menú digital</a>
                <a th:href="@{/mesas}">Mesas</a>
                <a class="active" th:href="@{/pedidos}">Pedidos</a>
                <a th:href="@{/facturas}">Facturación</a>
                <a th:href="@{/reportes}">Reportes</a>
            </nav>
        </aside>
        <main class="main">
            <header class="top">
                <div>
                    <p class="eyebrow">SISPE / OPERACIÓN</p>
                    <h1 class="title">Registrar nuevo pedido</h1>
                    <p class="sub">Crea un pedido nuevo para una mesa.</p>
                </div><a class="btn" th:href="@{/pedidos}">Volver</a>
            </header>
            <section class="form-card">
                <form method="post" th:action="@{/pedidos/guardar}" class="form-grid" th:object="${pedido}"><label>Mesa<input
                            type="number" th:field="*{mesaId}" required></label><label>Documento cliente<input
                            type="number" th:field="*{clienteId}"></label><label>Estado<select th:field="*{estado}">
                            <option value="pendiente">Pendiente</option>
                            <option value="en_preparacion">En preparación</option>
                            <option value="en_camino">En camino</option>
                            <option value="entregado">Entregado</option>
                        </select></label><label>Prioridad<select th:field="*{prioridad}">
                            <option value="normal">Normal</option>
                            <option value="alta">Alta</option>
                        </select></label><label>Observaciones<textarea
                            th:field="*{observaciones}"></textarea></label><label>Tiempo estimado<input type="number"
                            th:field="*{tiempoEstimado}" min="0"></label>
                    <div class="form-actions"><a class="btn secondary" th:href="@{/pedidos}">Cancelar</a><button class="btn"
                            type="submit">Guardar pedido</button></div>
                </form>
            </section>
        </main>
    </div>
</body>

</html>

<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Bienvenido | SISPE</title>
    <link rel="stylesheet" th:href="@{/css/sispe.css}">
</head>

<body class="digital-page">
    <main class="digital-content escanear-wrap">
        <div class="escanear-card">
            <p class="eyebrow">SISPE / BIENVENIDA</p>
            <h1>¡Bienvenido! </h1>
            <p class="escanear-mesa">Estás en la <strong>Mesa <span th:text="${mesa.id}">1</span></strong>
                <span th:if="${mesa.ubicacion}" th:text="'· ' + ${mesa.ubicacion}"></span>
            </p>

            <p th:if="${error}" class="escanear-error" th:text="${error}"></p>

            <form method="post" th:action="@{'/cliente/escanear/' + ${mesa.id}}" class="form escanear-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label>Tu nombre
                    <input type="text" name="nombre" placeholder="¿Cómo te llamas?" required>
                </label>
                <label>Tu cédula
                    <input type="number" name="cedula" placeholder="Número de documento" required>
                </label>
                <button class="btn-agregar" type="submit">Empezar a pedir 🍔</button>
            </form>
        </div>
    </main>
</body>

</html>

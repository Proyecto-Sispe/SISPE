<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Mi pedido | SISPE</title>
    <link rel="stylesheet" th:href="@{/css/sispe.css}">
</head>

<body class="digital-page">
    <main class="digital-content">
        <a class="logout" th:href="@{/menu/digital}">← Seguir viendo el menú</a>
        <h1>Mi pedido</h1>

        <p th:if="${error}" th:text="${error}" style="color:#ff8686;font-weight:bold;"></p>

        <p class="cart-locked" th:if="${confirmado}">
            ✅ Tu pedido ya fue enviado a cocina y no se puede modificar. Puedes ver su estado
            <a th:href="@{/cliente/estado}">aquí</a>.
        </p>

        <div class="cart-item" th:each="item : ${items}">
            <div class="cart-item-main">
                <h2 th:text="${item.menu.producto}">Producto</h2>
                <p class="cart-qty" th:text="'Cantidad: ' + ${item.cantidad}">Cantidad: 1</p>
                <p th:if="${item.observaciones}" class="cart-note" th:text="'Nota: ' + ${item.observaciones}">Nota</p>
                <ul class="cart-adiciones"
                    th:if="${!#lists.isEmpty(adicionesPorDetalle.findByDetallePedido_Id(item.id))}">
                    <li th:each="extra : ${adicionesPorDetalle.findByDetallePedido_Id(item.id)}"
                        th:text="'+ ' + ${extra.adicion.nombre}">Adición</li>
                </ul>
            </div>
            <div class="cart-item-side">
                <p class="precio" th:text="${#numbers.formatDecimal(item.valorVenta, 0, 'POINT', 0, 'COMMA') + ' $'}">
                    $0</p>
                <form th:if="${!confirmado}" method="post" th:action="@{'/cliente/carrito/eliminar/' + ${item.id}}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button class="btn danger small" type="submit">Cancelar</button>
                </form>
            </div>
        </div>

        <p th:if="${#lists.isEmpty(items)}">Tu pedido está vacío.</p>

        <div class="cart-total" th:if="${!#lists.isEmpty(items)}">
            <span>Total</span>
            <strong th:text="${#numbers.formatDecimal(total, 0, 'POINT', 0, 'COMMA') + ' $'}">$0</strong>
        </div>

        <div class="cart-actions" th:if="${!#lists.isEmpty(items) && !confirmado}">
            <form method="post" th:action="@{/cliente/carrito/vaciar}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn danger" type="submit">Vaciar pedido</button>
            </form>
            <a class="btn" th:href="@{/cliente/pago}">Continuar con el pedido →</a>
        </div>
    </main>
</body>

</html>

<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Método de pago | SISPE</title>
    <link rel="stylesheet" th:href="@{/css/sispe.css}">
</head>

<body class="digital-page">
    <main class="digital-content">
        <a class="logout" th:href="@{/cliente/pedido}">← Volver a mi pedido</a>
        <h1>¿Cómo vas a pagar?</h1>

        <p th:if="${error}" th:text="${error}" style="color:#ff8686;font-weight:bold;"></p>

        <div class="cart-total">
            <span>Total a pagar</span>
            <strong th:text="${#numbers.formatDecimal(total, 0, 'POINT', 0, 'COMMA') + ' $'}">$0</strong>
        </div>

        <form method="post" th:action="@{/cliente/pago/confirmar}" class="pay-options">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label class="pay-option" th:each="metodo : ${metodos}">
                <input type="radio" name="metodoPagoId" th:value="${metodo.id}" required>
                <span th:text="${metodo.tipo}">Método</span>
            </label>
            <button class="btn" type="submit">Confirmar pedido y pagar</button>
        </form>
    </main>
</body>

</html>

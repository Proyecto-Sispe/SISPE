<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña - SISPE</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background: #f8fafc; color: #334155; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 2rem 0; }
        .card { background: white; padding: 2.5rem; border-radius: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h1 { margin-bottom: 0.5rem; color: #0f172a; text-align: center; font-size: 1.4rem; }
        p.info { text-align: center; color: #64748b; font-size: 0.9rem; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; font-weight: 600; color: #475569; }
        input { width: 100%; padding: 0.6rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; }
        input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
        button { width: 100%; padding: 0.75rem; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 0.5rem; font-size: 0.95rem; }
        button:hover { background: #1d4ed8; }
        .footer-link { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; }
        .footer-link a { color: #2563eb; text-decoration: none; font-weight: 600; }
    </style>
</head>

<body>
    <div class="card">
        <h1>Recuperar contraseña</h1>
        <p class="info">Escribe el correo con el que te registraste. Si existe una cuenta, te enviaremos un código de 6 dígitos.</p>

        <form th:action="@{/login/olvide}" method="post">
            <div class="form-group">
                <label>Correo:</label>
                <input type="email" name="correo" required autofocus>
            </div>
            <button type="submit">Enviar código</button>
        </form>

        <div class="footer-link">
            <a th:href="@{/login}">Volver a iniciar sesión</a>
        </div>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña - SISPE</title>
    <style>
        :root { --navy: #102a43; --blue: #2563eb; --sky: #eff6ff; --muted: #627d98; --line: #d9e2ec; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background: linear-gradient(135deg, #eef5ff 0%, #f8fbff 52%, #e5eefb 100%); color: var(--navy); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1.5rem; }
        .card { background: #fff; padding: 2.5rem 2.25rem 2rem; border: 1px solid rgba(217,226,236,.85); border-radius: 22px; box-shadow: 0 20px 45px rgba(16,42,67,.12); width: 100%; max-width: 440px; }
        .brand { display: flex; justify-content: center; align-items: center; gap: .65rem; margin-bottom: 1.75rem; color: var(--blue); font-weight: 800; letter-spacing: .12em; font-size: .78rem; }
        .brand-mark { display: grid; place-items: center; width: 2.4rem; height: 2.4rem; border-radius: 12px; background: var(--blue); color: #fff; font-size: 1.15rem; box-shadow: 0 8px 16px rgba(37,99,235,.22); }
        .icon { display: grid; place-items: center; width: 4rem; height: 4rem; margin: 0 auto 1rem; border-radius: 50%; background: var(--sky); color: var(--blue); font-size: 1.7rem; }
        h1 { margin-bottom: .65rem; color: var(--navy); text-align: center; font-size: 1.65rem; letter-spacing: -.02em; }
        p.info { text-align: center; color: var(--muted); font-size: .94rem; line-height: 1.6; margin-bottom: 1.7rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: .5rem; font-size: .88rem; font-weight: 700; color: var(--navy); }
        input { width: 100%; padding: .82rem .95rem; border: 1px solid var(--line); border-radius: 10px; font-size: .95rem; color: var(--navy); background: #fbfdff; transition: border-color .2s, box-shadow .2s; }
        input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 4px rgba(37,99,235,.12); background: #fff; }
        button { width: 100%; padding: .86rem; background: var(--blue); color: #fff; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: .55rem; font-size: .95rem; transition: transform .2s, background .2s, box-shadow .2s; box-shadow: 0 8px 15px rgba(37,99,235,.2); }
        button:hover { background: #1d4ed8; transform: translateY(-1px); box-shadow: 0 10px 20px rgba(37,99,235,.25); }
        .hint { display: flex; gap: .45rem; align-items: flex-start; margin-top: .85rem; color: var(--muted); font-size: .78rem; line-height: 1.45; }
        .footer-link { text-align: center; margin-top: 1.7rem; padding-top: 1.25rem; border-top: 1px solid #edf2f7; font-size: .9rem; }
        .footer-link a { color: var(--blue); text-decoration: none; font-weight: 700; }
        .footer-link a:hover { text-decoration: underline; }
        @media (max-width: 480px) { .card { padding: 2rem 1.35rem 1.5rem; } }
    </style>
</head>

<body>
    <main class="card">
        <div class="brand"><span class="brand-mark" aria-hidden="true">S</span> SISPE</div>
        <div class="icon" aria-hidden="true">@</div>
        <h1>Recupera tu contraseña</h1>
        <p class="info">No te preocupes, te ayudamos a recuperar el acceso. Escribe tu correo y te enviaremos un código de verificación de 6 dígitos.</p>

        <form th:action="@{/login/olvide}" method="post">
            <div class="form-group">
                <label for="correo">Correo electrónico</label>
                <input id="correo" type="email" name="correo" placeholder="tucorreo@ejemplo.com" autocomplete="email" required autofocus>
            </div>
            <button type="submit">Enviar código</button>
            <p class="hint"><span aria-hidden="true">i</span> Revisa también la carpeta de spam si no encuentras el correo.</p>
        </form>

        <div class="footer-link">
            <a th:href="@{/login}">Volver a iniciar sesión</a>
        </div>
    </main>
</body>

</html>

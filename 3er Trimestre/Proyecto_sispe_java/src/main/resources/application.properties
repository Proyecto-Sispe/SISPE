spring.application.name=springboot-web

# Conexion con MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/sistema?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Corrección para el error de metadatos/RESERVED en XAMPP:
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.auto_quote_keyword=false

# Evita que Hibernate convierta nombres de columna en camelCase (ej. idRol)
# a snake_case (ej. id_rol) cuando ya especificamos el nombre exacto con @Column
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Thymeleaf
spring.thymeleaf.cache=false

# Puerto del servidor
server.port=8080

# Envío de correos para recuperación de contraseña
# Perfil local: crea el bean JavaMailSender sin exponer credenciales.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas · SISPE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand fw-bold">SISPE | Estadísticas</span>
            <a href="{% url 'portal' %}" class="btn btn-outline-light btn-sm">Portal</a>
        </div>
    </nav>
    <main class="container">
        <div class="row g-3">
            <div class="col-md-3 col-sm-6"><div class="card shadow-sm text-center"><div class="card-body">
                <div class="text-muted small">Ventas de hoy</div><div class="fs-3 fw-bold">${{ ventas_hoy }}</div>
            </div></div></div>
            <div class="col-md-3 col-sm-6"><div class="card shadow-sm text-center"><div class="card-body">
                <div class="text-muted small">Pedidos entregados</div><div class="fs-3 fw-bold">{{ pedidos_completados }}</div>
            </div></div></div>
            <div class="col-md-3 col-sm-6"><div class="card shadow-sm text-center"><div class="card-body">
                <div class="text-muted small">Mesas ocupadas</div><div class="fs-3 fw-bold">{{ mesas_activas }}</div>
            </div></div></div>
            <div class="col-md-3 col-sm-6"><div class="card shadow-sm text-center"><div class="card-body">
                <div class="text-muted small">Producto más vendido</div><div class="fs-5 fw-bold">{{ producto_mas_vendido }}</div>
            </div></div></div>
        </div>
    </main>
</body>
</html>

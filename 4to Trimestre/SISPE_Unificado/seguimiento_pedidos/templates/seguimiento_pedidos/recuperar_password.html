<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña | SISPE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body {
      min-height: 100vh;
      background: #0d0d0d;
      color: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #171717;
      border: 1px solid #2b2b2b;
      border-top: 4px solid #ff6a00;
      border-radius: 10px;
      padding: 28px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
    }
    h1 { color: #ff7b00; font-size: 22px; margin-bottom: 6px; }
    p.sub { color: #a3a3a3; font-size: 14px; margin-bottom: 20px; }
    label { display: block; font-size: 13px; color: #f5f5f5; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 11px 12px;
      margin-bottom: 16px;
      background: #0f0f0f;
      border: 1px solid #333;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
    }
    input:focus { outline: none; border-color: #ff6a00; }
    button {
      width: 100%;
      padding: 12px;
      background: #ff6a00;
      border: none;
      border-radius: 6px;
      color: #0d0d0d;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover { background: #ff8026; }
    .msg {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }
    .msg.ok { display: block; background: rgba(255, 106, 0, 0.15); border: 1px solid #ff6a00; color: #ffc299; }
    .msg.err { display: block; background: rgba(220, 38, 38, 0.15); border: 1px solid #ef4444; color: #fca5a5; }
    .back { margin-top: 16px; text-align: center; }
    .back a { color: #ff7b00; text-decoration: none; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Recuperar Contraseña</h1>
    <p class="sub">Te enviaremos un código y enlace a tu correo registrado.</p>

    <form id="formRecuperar">
      <label for="correo">Correo registrado</label>
      <input type="email" id="correo" name="correo" required placeholder="usuario@correo.com">
      <button type="submit">Enviar correo de recuperación</button>
    </form>

    <div id="respuesta" class="msg"></div>

    <div class="back">
      <a href="{% url 'login' %}">Volver al inicio de sesión</a>
    </div>
  </div>

  <script>
    document.getElementById('formRecuperar').addEventListener('submit', async function (e) {
      e.preventDefault();
      const correo = document.getElementById('correo').value.trim();
      const box = document.getElementById('respuesta');
      box.className = 'msg';
      box.textContent = 'Enviando...';
      box.style.display = 'block';

      try {
        const res = await fetch("{% url 'api_recuperar_password' %}", {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ correo })
        });
        const data = await res.json();
        box.className = data.ok ? 'msg ok' : 'msg err';
        box.textContent = data.mensaje;
      } catch (err) {
        box.className = 'msg err';
        box.textContent = 'Error de conexión con el servidor.';
      }
    });
  </script>
</body>
</html>

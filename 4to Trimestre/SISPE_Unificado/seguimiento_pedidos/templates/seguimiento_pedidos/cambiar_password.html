{% extends "registration/password_reset_base.html" %}

{% block password_reset_content %}
  <h1>Cambiar contraseña</h1>
  <p>Confirma tu contraseña actual y escribe una nueva. Debe tener al menos 12 caracteres y no ser común.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Guardar contraseña</button>
  </form>
  <p><a href="{% url 'portal' %}">Volver al portal</a></p>
{% endblock %}

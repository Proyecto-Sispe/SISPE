{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | SISPE</title>
  <link rel="icon" href="{% static 'img/logo_2.png' %}" type="image/png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body {
      min-height: 100vh;
      background: #0d0d0d;
      color: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: #171717;
      border: 1px solid #2b2b2b;
      border-top: 4px solid #ff6a00;
      border-radius: 10px;
      padding: 28px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
    }
    h1 { color: #ff7b00; font-size: 24px; margin-bottom: 6px; }
    p.sub { color: #a3a3a3; font-size: 14px; margin-bottom: 22px; }
    label { display: block; font-size: 13px; color: #f5f5f5; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 11px 12px;
      margin-bottom: 16px;
      background: #0f0f0f;
      border: 1px solid #333;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
    }
    input:focus { outline: none; border-color: #ff6a00; }
    button {
      width: 100%;
      padding: 12px;
      background: #ff6a00;
      border: none;
      border-radius: 6px;
      color: #0d0d0d;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover { background: #ff8026; }
    .alert {
      background: rgba(255, 106, 0, 0.14);
      border: 1px solid #ff6a00;
      color: #ffb380;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
    }
    .extra { margin-top: 16px; text-align: center; }
    .extra a { color: #ff7b00; text-decoration: none; font-size: 13px; }
    .extra a:hover { text-decoration: underline; }
    .marca-login { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .marca-login img { width: 58px; height: 58px; object-fit: contain; }
  </style>
</head>
<body>
  <div class="card">
    <div class="marca-login">
      <img src="{% static 'img/logo_2.png' %}" alt="">
      <h1>SISPE</h1>
    </div>
    <p class="sub">Acceso al sistema por rol</p>

    {% if messages %}
      {% for message in messages %}
        <div class="alert">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <label for="correo">Correo o usuario</label>
      <input type="text" id="correo" name="correo" required placeholder="admin@gmail.com o chef" autofocus>

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required placeholder="••••••••">

      <button type="submit">Ingresar</button>
    </form>

    <div class="extra">
      <a href="{% url 'recuperar_password' %}">Recuperar cuenta SISPE</a>
      &nbsp;·&nbsp; <a href="{% url 'password_reset' %}">Recuperar cuenta administrativa</a>
      &nbsp;·&nbsp; <a href="{% url 'registro' %}">Crear cuenta</a>
      &nbsp;·&nbsp; <a href="{% url 'home' %}">Volver al inicio</a>
    </div>
  </div>
</body>
</html>

{% extends "mesas_pedidos/base.html" %}
{% block title %}Eliminar mesa · SISPE{% endblock %}
{% block content %}
<div class="card shadow-sm mx-auto" style="max-width:520px">
    <div class="card-body">
        <h2 class="h5">¿Eliminar la mesa #{{ mesa.id }} ({{ mesa.ubicacion }})?</h2>
        <p class="text-muted">Esta acción no se puede deshacer.</p>
        <form method="post">{% csrf_token %}
            <button class="btn btn-danger">Sí, eliminar</button>
            <a href="{% url 'mesas_list' %}" class="btn btn-link">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}

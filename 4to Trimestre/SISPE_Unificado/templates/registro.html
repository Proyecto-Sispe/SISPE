{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta | SISPE</title>
  <link rel="icon" href="{% static 'img/logo_2.png' %}" type="image/png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Arial, sans-serif; }
    body {
      min-height: 100vh;
      background: #0d0d0d;
      color: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }
    .card {
      width: 100%;
      max-width: 600px;
      background: #171717;
      border: 1px solid #2b2b2b;
      border-top: 4px solid #ff7b00;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
    }
    .header-form {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .header-form img {
      width: 58px;
      height: 58px;
      object-fit: contain;
    }
    h1 { color: #ff7b00; font-size: 24px; font-weight: 800; }
    p.sub { color: #a3a3a3; font-size: 14px; margin-bottom: 24px; }
    
    .grid-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 22px;
    }
    .full-width {
      grid-column: 1 / -1;
    }
    label { display: block; font-size: 13px; color: #f5f5f5; margin-bottom: 6px; font-weight: 600; }
    input, select {
      width: 100%;
      padding: 11px 12px;
      background: #0f0f0f;
      border: 1px solid #333;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    input:focus, select:focus { outline: none; border-color: #ff7b00; }
    
    .acciones {
      display: flex;
      gap: 12px;
    }
    button.guardar {
      flex: 2;
      padding: 12px;
      background: #ff7b00;
      border: none;
      border-radius: 6px;
      color: #141414;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button.guardar:hover { background: #ff6a00; color: #141414; }
    
    a.cancelar {
      flex: 1;
      padding: 12px;
      background: transparent;
      border: 1px solid #2b2b2b;
      border-radius: 6px;
      color: #a3a3a3;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    a.cancelar:hover { border-color: #888; color: #fff; }

    .alert {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 18px;
    }
    .extra { margin-top: 20px; text-align: center; }
    .extra a { color: #ff7b00; text-decoration: none; font-size: 13px; }
    .extra a:hover { text-decoration: underline; }

    @media (max-width: 600px) {
      .grid-form { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header-form">
      <img src="{% static 'img/logo.png' %}" alt="Logo SISPE">
      <div>
        <h1>Registrar Nueva Cuenta</h1>
        <p class="sub" style="margin: 0;">Regístrate como cliente para realizar y consultar tus pedidos</p>
      </div>
    </div>

    {% if messages %}
      {% for message in messages %}
        <div class="alert">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div class="grid-form">
        <div>
          <label for="doc">Tipo de Documento *</label>
          <select id="doc" name="doc" required>
            {% for t in tipos_doc %}
              <option value="{{ t.id_doc }}">{{ t.tipo_doc }}</option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label for="id">Número de Documento *</label>
          <input type="text" id="id" name="id" required placeholder="Ej. 1020304050" autofocus>
        </div>

        <div>
          <label for="nombre1">Primer Nombre *</label>
          <input type="text" id="nombre1" name="nombre1" required placeholder="Ej. Carlos">
        </div>

        <div>
          <label for="nombre2">Segundo Nombre</label>
          <input type="text" id="nombre2" name="nombre2" placeholder="Opcional">
        </div>

        <div>
          <label for="apellido1">Primer Apellido *</label>
          <input type="text" id="apellido1" name="apellido1" required placeholder="Ej. Gómez">
        </div>

        <div>
          <label for="apellido2">Segundo Apellido</label>
          <input type="text" id="apellido2" name="apellido2" placeholder="Opcional">
        </div>

        <div class="full-width">
          <label for="email">Correo Electrónico *</label>
          <input type="email" id="email" name="email" required placeholder="tu_correo@ejemplo.com">
        </div>

        <div>
          <label for="telefono">Teléfono *</label>
          <input type="text" id="telefono" name="telefono" required placeholder="Ej. 3001234567">
        </div>

        <div>
          <label for="password">Contraseña *</label>
          <input type="password" id="password" name="password" minlength="12" autocomplete="new-password" required placeholder="Mínimo 12 caracteres">
        </div>
      </div>

      <div class="acciones">
        <a class="cancelar" href="{% url 'home' %}">Cancelar</a>
        <button class="guardar" type="submit">Crear Mi Cuenta</button>
      </div>
    </form>

    <div class="extra">
      ¿Ya tienes una cuenta? <a href="{% url 'login' %}">Iniciar Sesión</a>
      &nbsp;·&nbsp; <a href="{% url 'home' %}">Volver al Inicio</a>
    </div>
  </div>
</body>
</html>

{% extends "base.html" %}

{% block titulo %}Recuperación de acceso | SISPE{% endblock %}
{% block seccion %}Seguridad{% endblock %}

{% block extra_head %}
  {{ block.super }}
  <style>
    .password-reset-card {
      max-width: 560px;
      margin: 36px auto;
      padding: 28px;
      background: #171717;
      border: 1px solid #2b2b2b;
      border-top: 4px solid #ff6a00;
      border-radius: 12px;
      color: #f5f5f5;
    }
    .password-reset-card h1 { margin: 0 0 10px; color: #ff7b00; }
    .password-reset-card p { margin: 12px 0; color: #d4d4d4; line-height: 1.55; }
    .password-reset-card form p { margin: 16px 0; }
    .password-reset-card label { display: block; margin-bottom: 6px; }
    .password-reset-card input[type="email"],
    .password-reset-card input[type="password"] {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #3a3a3a;
      border-radius: 8px;
      background: #0d0d0d;
      color: #f5f5f5;
    }
    .password-reset-card input:focus { outline: 2px solid #ff6a00; outline-offset: 1px; }
    .password-reset-card .helptext { display: block; margin-top: 6px; color: #a3a3a3; font-size: 13px; }
    .password-reset-card .errorlist { margin: 6px 0; color: #ff8a8a; }
    .password-reset-card button {
      padding: 11px 16px;
      border: 0;
      border-radius: 8px;
      background: #ff6a00;
      color: #141414;
      font-weight: 700;
      cursor: pointer;
    }
    .password-reset-card button:hover { background: #ff8026; }
    .password-reset-card a { color: #ff9a45; }
    @media (max-width: 600px) {
      .password-reset-card { margin: 20px auto; padding: 20px; }
    }
  </style>
{% endblock %}

{% block contenido %}
  <section class="password-reset-card">
    {% block password_reset_content %}{% endblock %}
  </section>
{% endblock %}
